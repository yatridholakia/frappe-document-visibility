name: Linters
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  linters:
    name: Frappe Semgrep + Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
      - name: Install tools
        run: pip install semgrep "ruff==0.16.5"
      - name: Run Frappe semgrep rules
        run: semgrep scan --config ./frappe-semgrep-rules/rules --severity ERROR --error document_visibility/
      - name: Run ruff linter
        run: ruff check document_visibility/
      - name: Run ruff formatter check
        run: ruff format --check document_visibility/
